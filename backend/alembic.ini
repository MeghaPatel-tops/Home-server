# HomeServe - Alembic Configuration File
# This file is read by the alembic CLI tool.
# The database URL is intentionally left as a placeholder because
# env.py reads it from application settings at runtime.

[alembic]
# Path to the alembic migration scripts directory
script_location = alembic

# Template for new migration filenames
# %%(rev)s  -> short revision hash
# %%(slug)s -> truncated human-readable description
file_template = %%(rev)s_%%(slug)s

# Timezone for the "Generating" timestamp printed to stdout
timezone = Asia/Kolkata

# Max length of the slug portion of migration filenames
truncate_slug_length = 40

# Prepend sys.path with the backend root so app.* imports resolve
prepend_sys_path = .

# sqlalchemy.url is NOT used — env.py reads it from app.core.config.settings.
# Leave this as a placeholder so the alembic CLI does not complain about
# a missing key when the [alembic] section is parsed.
sqlalchemy.url = placeholder://

[post_write_hooks]
# No post-write hooks configured.

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
